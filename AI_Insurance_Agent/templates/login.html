<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agent BuddyBee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            max-height: 60px;
            width: auto;
        }
        .ms-button {
            background-color: #0078d4;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
            text-decoration: none;
        }
        .ms-button:hover {
            background-color: #106ebe;
        }
        .error-message {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="text-center mb-8">
                <img src="/static/images/beeonix.png" alt="Beeonix Logo" class="logo mx-auto mb-4">
                <h1 class="text-2xl font-bold text-gray-900">Agent BuddyBee</h1>
                <p class="text-gray-600 mt-2">Sign in to access your insurance assistant</p>
            </div>
            
            
            <div class="space-y-4">
                <a href="/login" class="ms-button w-full justify-center">
                    <svg width="21" height="21" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
                        <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
                        <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
                        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
                    </svg>
                    Sign in with Microsoft
                </a>
            </div>
            
            <div class="mt-8 text-center text-sm text-gray-600">
                <p>By signing in, you agree to our Terms of Service and Privacy Policy</p>
            </div>
            
            <div class="mt-4 text-center">
                <img src="/static/images/Bigtapplogo.png" alt="Bigtapp Analytics Logo" class="logo mx-auto" style="max-height: 30px;">
            </div>
        </div>
    </div>
</body>
</html>
