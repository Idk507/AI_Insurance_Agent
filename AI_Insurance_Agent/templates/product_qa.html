<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent BuddyBee - Product Q&A</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        header {
            background-color: #7a9eff;
            color: white;
            z-index: 20;
            height: 80px;
        }
        .bg-blue-100 { background-color: #dbeafe; }
        .bg-blue-200 { background-color: #bfdbfe; }
        .bg-blue-500 { background-color: #3b82f6; }
        .bg-blue-700 { background-color: #1e40af; }
        .text-blue-500 { color: #3b82f6; }
        .border-blue-300 { border-color: #93c5fd; }
        .focus:ring-blue-500 { --tw-ring-color: #3b82f6; }
        .sidebar {
            width: 180px;
            background-color: #dbeafe;
            min-height: calc(100vh - 80px);
            position: fixed;
            top: 80px;
            left: 0;
            z-index: 10;
            padding-top: 1rem;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.9rem;
        }
        .sidebar-item:hover { background-color: #bfdbfe; }
        .sidebar-item.active { background-color: #3b82f6; color: white; }
        .content-area {
            margin-left: 180px;
            margin-top: 80px;
            padding: 2rem;
            min-height: calc(100vh - 80px);
            background-color: #ffffff;
        }
        .logo { max-height: 40px; width: auto; }
        .chat-container { max-height: 60vh; overflow-y: auto; }
        .chat-message { margin: 0.5rem 0; padding: 1rem; border-radius: 0.5rem; }
        .user-message { background-color: #e0f2fe; text-align: right; }
        .assistant-message { background-color: #f3f4f6; }
        .interactive-btn { transition: transform 0.2s; }
        .interactive-btn:hover { transform: scale(1.05); }
        @media (max-width: 640px) {
            header { flex-direction: column; align-items: center; padding: 0.5rem; height: auto; }
            .sidebar { width: 100%; position: static; min-height: auto; top: auto; padding-top: 0.5rem; }
            .content-area { margin-left: 0; margin-top: 0; padding: 1rem; }
            .logo { max-height: 30px; }
            .chat-container { max-height: 50vh; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Top Header Bar -->
    <header class="p-4 flex justify-between items-center shadow-md fixed w-full top-0">
        <div class="flex items-center">
            <img src="/static/images/beeonix.png" alt="Beeonix Logo" class="logo mr-4">
        </div>
        <div class="flex items-center justify-center flex-1">
            <h1 class="text-lg font-bold">Agent BuddyBee - Product Q&A</h1>
        </div>
        <div class="flex items-center">
            <img src="/static/images/Bigtapplogo.png" alt="Bigtapp Analytics Logo" class="logo">
        </div>
    </header>

    <!-- Left Sidebar -->
    <div class="sidebar flex flex-col">
       <div class="sidebar-item active" data-page="home">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Home
        </div>
        <div class="sidebar-item" data-page="customer_details">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg>
            Customer Details
        </div>
        <div class="sidebar-item" data-page="product_qa">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Product Q&A
        </div>
        <div class="sidebar-item" data-page="knowledge">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253"></path></svg>
            Knowledge
        </div>
        <div class="sidebar-item" data-page="insights">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Insights
        </div>
        <div class="sidebar-item" data-page="conversations">
            <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="Communication / Chat_Conversation">
                    <path id="Vector"
                        d="M16 8H20C20.5523 8 21 8.44772 21 9V20L17.667 17.231C17.4875 17.0818 17.2608 17 17.0273 17H9C8.44771 17 8 16.5523 8 16V13M16 8V5C16 4.44772 15.5523 4 15 4H4C3.44772 4 3 4.44772 3 5V16.0003L6.33301 13.2308C6.51255 13.0817 6.73924 13 6.97266 13H8M16 8V12C16 12.5523 15.5523 13 15 13H8"
                        stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            </svg>
            Conversations
        </div>
        <div class="sidebar-item" data-page="settings">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            Settings
        </div>
        <div class="sidebar-item" data-page="home" id="currentChatButton">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Current Chat
        </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Product Q&A</h2>
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col h-full">
            <!-- Chat Container -->
            <div id="chatContainer" class="chat-container mb-4 flex-1"></div>

            <!-- Suggestions -->
            <div id="suggestions" class="mb-4"></div>

            <!-- Chat Controls -->
            <div class="flex flex-col gap-2">
                <!-- Language Selection -->
                <div class="flex flex-col sm:flex-row gap-2 mb-2">
                    <select id="languageSelect" class="p-2 border border-blue-300 rounded-md">
                        <option value="en">English</option>
                        <option value="ms">Malay</option>
                        <option value="zh">Mandarin</option>
                    </select>
                </div>

                <!-- Chat Input Form -->
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="chatInput" placeholder="Ask about our insurance products..." class="flex-1 p-2 border border-blue-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    <button id="sendButton" class="p-2 bg-blue-500 text-white rounded-md interactive-btn">Send</button>
                    <button id="voiceButton" class="p-2 bg-blue-500 text-white rounded-md interactive-btn">🎙️</button>
                </div>
                <p id="chatStatus" class="text-sm mt-2"></p>
            </div>
        </div>
    </div>

    <script>
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const voiceButton = document.getElementById('voiceButton');
        const chatContainer = document.getElementById('chatContainer');
        const chatStatus = document.getElementById('chatStatus');
        const suggestionsContainer = document.getElementById('suggestions');
        const languageSelect = document.getElementById('languageSelect');
        const API_BASE = 'http://localhost:8000/api';
        let sessionId = new URLSearchParams(window.location.search).get('session') || `product_qa_${Date.now()}`;
        let isRecording = false;
        let recognition;

        // Apply theme
        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'light';
            document.body.className = theme === 'dark' ? 'bg-gray-900 text-white flex flex-col min-h-screen' : 'bg-white text-black flex flex-col min-h-screen';
            document.querySelector('.sidebar').className = theme === 'dark' ? 'sidebar flex flex-col bg-gray-800' : 'sidebar flex flex-col bg-blue-100';
            document.querySelector('.content-area').className = theme === 'dark' ? 'content-area bg-gray-900' : 'content-area bg-white';
            document.querySelector('header').className = theme === 'dark' ? 'p-4 flex justify-between items-center shadow-md fixed w-full top-0 bg-gray-700' : 'p-4 flex justify-between items-center shadow-md fixed w-full top-0 bg-blue-500';
        }
        applyTheme();

        // Sidebar navigation
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                if (page) {
                    if (page === 'home' && item.id === 'currentChatButton') {
                        const sessionId = localStorage.getItem('currentSessionId') || '';
                        window.location.href = `home.html?session=${sessionId}`;
                    } else if (page !== 'product_qa') {
                        window.location.href = `${page}.html`;
                    }
                }
            });
        });

        // Load chat history
        async function loadChatHistory() {
            try {
                const response = await axios.get(`${API_BASE}/chat_history`);
                const sessions = response.data.sessions || {};
                const session = sessions[sessionId];
                if (session && session.messages) {
                    session.messages.forEach(msg => {
                        displayMessage(msg.role, msg.content);
                    });
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
                chatStatus.textContent = 'Failed to load chat history.';
                chatStatus.classList.add('text-red-500');
            }
        }

        // Display chat message
        function displayMessage(role, content) {
            const div = document.createElement('div');
            div.className = `chat-message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
            div.innerHTML = content.replace(/\n/g, '<br>');
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Display suggestions
        function displaySuggestions(suggestions) {
            suggestionsContainer.innerHTML = '';
            if (suggestions && suggestions.length > 0) {
                const ul = document.createElement('ul');
                ul.className = 'flex flex-wrap gap-2';
                suggestions.forEach(suggestion => {
                    const li = document.createElement('li');
                    li.className = 'p-2 bg-blue-100 text-blue-500 rounded-md cursor-pointer hover:bg-blue-200';
                    li.textContent = suggestion;
                    li.addEventListener('click', () => {
                        chatInput.value = suggestion;
                        sendMessage('text');
                    });
                    ul.appendChild(li);
                });
                suggestionsContainer.appendChild(ul);
            }
        }

        // Handle voice input (Speech-to-Text)
        function setupVoiceRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = languageSelect.value === 'ms' ? 'ms-MY' : languageSelect.value === 'zh' ? 'zh-CN' : 'en-US';

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    chatInput.value = transcript;
                    sendMessage('voice');
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    chatStatus.textContent = 'Voice recognition failed. Please try again.';
                    chatStatus.classList.add('text-red-500');
                    stopRecording();
                };

                recognition.onend = () => {
                    stopRecording();
                };
            } else {
                voiceButton.disabled = true;
                voiceButton.classList.add('opacity-50', 'cursor-not-allowed');
                chatStatus.textContent = 'Voice recognition not supported in this browser.';
                chatStatus.classList.add('text-red-500');
            }
        }

        function startRecording() {
            if (recognition) {
                recognition.lang = languageSelect.value === 'ms' ? 'ms-MY' : languageSelect.value === 'zh' ? 'zh-CN' : 'en-US';
                recognition.start();
                isRecording = true;
                voiceButton.textContent = '⏹️';
                chatStatus.textContent = 'Recording...';
                chatStatus.classList.remove('text-red-500', 'text-green-500');
                chatStatus.classList.add('text-gray-500');
                chatInput.disabled = true;
                chatInput.classList.add('opacity-50');
            }
        }

        function stopRecording() {
            if (recognition && isRecording) {
                recognition.stop();
            }
            isRecording = false;
            voiceButton.textContent = '🎙️';
            chatStatus.textContent = 'Voice input stopped.';
            chatStatus.classList.remove('text-gray-500', 'text-red-500');
            chatStatus.classList.add('text-green-500');
            chatInput.disabled = false;
            chatInput.classList.remove('opacity-50');
        }

        // Send message
        async function sendMessage(inputType) {
            const message = chatInput.value.trim();
            if (!message) {
                chatStatus.textContent = 'Please enter a message.';
                chatStatus.classList.add('text-red-500');
                return;
            }

            displayMessage('user', message);
            chatStatus.textContent = 'Sending...';
            chatStatus.classList.remove('text-red-500', 'text-green-500');
            chatStatus.classList.add('text-gray-500');
            sendButton.disabled = true;
            sendButton.classList.add('opacity-50', 'cursor-not-allowed');
            voiceButton.disabled = true;
            voiceButton.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await axios.post(`${API_BASE}/chat`, {
                    message,
                    language: languageSelect.value,
                    input_mode: inputType,
                    output_mode: 'text',
                    session_id: sessionId
                });
                displayMessage('assistant', response.data.response);
                displaySuggestions(response.data.suggestions || []);
                chatStatus.textContent = 'Message sent successfully.';
                chatStatus.classList.remove('text-gray-500', 'text-red-500');
                chatStatus.classList.add('text-green-500');
                chatInput.value = '';
                localStorage.setItem('currentSessionId', sessionId);
            } catch (error) {
                console.error('Error sending message:', error);
                chatStatus.textContent = error.response?.data?.detail || 'Failed to send message.';
                chatStatus.classList.remove('text-gray-500', 'text-green-500');
                chatStatus.classList.add('text-red-500');
            } finally {
                sendButton.disabled = false;
                sendButton.classList.remove('opacity-50', 'cursor-not-allowed');
                voiceButton.disabled = false;
                voiceButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            } else {
                sendMessage('text');
            }
        });

        voiceButton.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isRecording) {
                e.preventDefault();
                sendMessage('text');
            }
        });

        languageSelect.addEventListener('change', () => {
            if (recognition) {
                recognition.lang = languageSelect.value === 'ms' ? 'ms-MY' : languageSelect.value === 'zh' ? 'zh-CN' : 'en-US';
            }
        });

        // Initialize
        loadChatHistory();
        setupVoiceRecognition();
    </script>
</body>
</html>
